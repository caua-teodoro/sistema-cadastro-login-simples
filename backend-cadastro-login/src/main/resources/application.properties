spring.application.name=backend-cadastro-login

# Database (Use variáveis de ambiente em produção: DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cadastro_login_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT (Em produção, defina JWT_SECRET obrigatoriamente com >= 32 caracteres aleatórios)
security.jwt.secret-key=${JWT_SECRET:chave-secreta-desenvolvimento-cadastro-login-minimo-32-bytes}
security.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:3600000}

# CORS (Origens separadas por vírgula)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}